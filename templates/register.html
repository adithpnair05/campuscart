{% extends "base.html" %}{% block title %}Create account{% endblock %}{% block content %}
<div class="auth-wrap"><div class="auth-card"><span class="eyebrow">GET STARTED</span><h1>Create your account</h1><p class="muted">Register as a student or faculty member.</p><form method="post" class="form">
<label>Full name<input name="name" required maxlength="100"></label><label>College email<input type="email" name="email" required></label><label>Account type<select name="role"><option value="student">Student</option><option value="faculty">Faculty</option></select></label><label>Password<input type="password" name="password" required minlength="8"><small>Use at least 8 characters.</small></label><button class="btn full">Create account</button></form><p class="auth-foot">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></div></div>{% endblock %}
