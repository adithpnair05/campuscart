<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fffbeb"/><stop offset="100%" stop-color="#fef3c7"/></linearGradient>
  </defs>
  <rect width="240" height="160" rx="14" fill="url(#bg)"/>
  <g transform="translate(120 82) rotate(-25)">
    <ellipse cx="0" cy="24" rx="78" ry="6" fill="#92400e" opacity=".12"/>
    <!-- Eraser -->
    <rect x="-76" y="-7.5" width="14" height="15" rx="4" fill="#f472b6"/>
    <!-- Ferrule -->
    <rect x="-64" y="-8" width="14" height="16" fill="#cbd5e1"/>
    <line x1="-60" y1="-8" x2="-60" y2="8" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="-54" y1="-8" x2="-54" y2="8" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Hexagonal body -->
    <rect x="-50" y="-8" width="98" height="5.5" fill="#fbbf24"/>
    <rect x="-50" y="-2.5" width="98" height="5" fill="#f59e0b"/>
    <rect x="-50" y="2.5" width="98" height="5.5" fill="#d97706"/>
    <text x="-8" y="2.5" font-family="sans-serif" font-size="7" font-weight="700" fill="#78350f">HB</text>
    <!-- Wood cone -->
    <polygon points="48,-8 72,-1.5 72,1.5 48,8" fill="#fde68a"/>
    <!-- Graphite tip -->
    <polygon points="66,-3.2 78,0 66,3.2" fill="#334155"/>
  </g>
</svg>